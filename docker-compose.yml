services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routeflow}
      POSTGRES_DB: ${POSTGRES_DB:-routeflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-routeflow} -d ${POSTGRES_DB:-routeflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: routeflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: routeflow-valhalla
    restart: unless-stopped
    ports:
      - '${VALHALLA_PORT:-8002}:8002'
    environment:
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - serve_tiles=True
    volumes:
      - valhalla_data:/data
      - ./infra/osm:/custom_files
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8002/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  tiles:
    image: maptiler/tileserver-gl-light:latest
    container_name: routeflow-tiles
    restart: unless-stopped
    command: ['-p', '8080']
    ports:
      - '${TILES_PORT:-8081}:8080'
    volumes:
      - ./infra/tiles:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  valhalla_data:
