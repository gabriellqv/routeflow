name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  convencao:
    name: Convenção do título
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do PR (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            O título do PR deve começar com minúscula e seguir
            `tipo(escopo): descrição` (ex.: `feat(api): adiciona CRUD de rotas`).
