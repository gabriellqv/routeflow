version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    # Agrupa apenas minor/patch (seguros e revisáveis juntos). Majors devem
    # chegar individualmente, pois costumam exigir ajustes de código/config.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Majors que hoje quebram a árvore de dependências (peer deps). Reavaliar
      # individualmente quando o ecossistema der suporte.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      - dependency-name: '@commitlint/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: '@commitlint/config-conventional'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-prettier'
        update-types: ['version-update:semver-major']
      - dependency-name: 'globals'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      include: scope
