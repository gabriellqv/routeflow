version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore'
      include: scope
