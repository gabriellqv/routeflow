<section class="login">
  <div class="login__card">
    <div class="login__brand">
      <span class="login__mark">RF</span>
      <div>
        <h1 class="login__title">RouteFlow</h1>
        <p class="login__subtitle">Painel de operações logísticas</p>
      </div>
    </div>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span class="field__label">E-mail</span>
        <input
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="voce@routeflow.dev"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Informe um e-mail válido</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Senha</span>
        <input
          class="field__input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error">Informe a senha</span>
        }
      </label>

      @if (error()) {
        <p class="login__error" role="alert">{{ error() }}</p>
      }

      <button class="login__submit" type="submit" [disabled]="loading()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
